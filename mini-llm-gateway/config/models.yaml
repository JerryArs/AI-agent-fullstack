# Mini LLM Gateway 运行时配置（design_spec.md §2.3 / §10.1）
# 字符串支持 ${VAR:default} 环境插值；凭据只由网关进程读取。
auth_token: ${GATEWAY_AUTH_TOKEN:}
fallback_model: general-backup
prompts_dir: prompts/bundles
enable_metrics: true

retry:
  max_attempts_per_model: 2
  base_delay_seconds: 0.1

rate_limit:
  enabled: false
  requests_per_minute: 60
  burst: 60

budget:
  enabled: false
  max_cost_usd: 0.0

models:
  general-primary:
    provider: openai_compatible
    provider_model: ${PRIMARY_PROVIDER_MODEL:deepseek-chat}
    base_url: ${PRIMARY_BASE_URL:https://api.deepseek.com}
    api_key_env: DEEPSEEK_API_KEY
    supports_structured_output: true
    structured_output_mode: json_object
    context_window: 65536
    price_per_million:
      input: 1.0
      output: 4.0
  general-backup:
    provider: openai_compatible
    provider_model: ${BACKUP_PROVIDER_MODEL:deepseek-chat}
    base_url: ${BACKUP_BASE_URL:https://api.deepseek.com}
    api_key_env: DEEPSEEK_BACKUP_API_KEY
    supports_structured_output: true
    structured_output_mode: json_object
    context_window: 65536
    price_per_million:
      input: 0.8
      output: 3.2
